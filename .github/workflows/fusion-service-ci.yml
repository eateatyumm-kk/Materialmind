name: fusion-service-ci

# Lint + test for the FastAPI inference service in Fusion_service/ only.
# Research code (Testing/, data ingestion/) and the repo-root requirements.txt are intentionally NOT used here:
# CI installs only Fusion_service/requirements*.txt, plus the CPU-only torch wheel.

on:
  push:
    branches: [main]
    paths:
      - "Fusion_service/**"
      - "!Fusion_service/**/*.md"
      - ".github/workflows/fusion-service-ci.yml"
  pull_request:
    paths:
      - "Fusion_service/**"
      - "!Fusion_service/**/*.md"
      - ".github/workflows/fusion-service-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fusion-service-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: Fusion_service
    env:
      CI: "true" # makes tests that need the trained checkpoints fail (not skip) if weights/ is incomplete
      MPLBACKEND: Agg
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: Fusion_service/requirements*.txt

      # CPU-only torch first: avoids the multi-GB CUDA/nvidia-* wheels PyPI would pull on Linux. The next step
      # sees torch==2.5.1 already satisfied (PEP 440 ignores the +cpu local tag when matching ==2.5.1).
      - name: Install CPU-only torch
        run: python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu

      - name: Install service + dev dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Test (pytest)
        run: pytest --cov=app --cov-report=term-missing --cov-report=xml

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-xml
          path: Fusion_service/coverage.xml
          if-no-files-found: ignore
